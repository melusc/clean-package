name: Run CI
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 24
          - 25
          - 26
    name: CI Node ${{ matrix.node-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: pnpm/setup@v3.0.0
        with:
          runtime: node@${{ matrix.node-version }}

      - name: Check code style
        run: |
          pnpm fmt
          git --no-pager diff --exit-code

      - name: Build
        run: pnpm build

      - run: pnpm test
